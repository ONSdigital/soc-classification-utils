---
    name: CI

    on: # yamllint disable-line rule:truthy
      push:
        branches: [main]
      pull_request:
        branches: [main]

    concurrency:
      group: "${{ github.head_ref || github.ref }}-${{ github.workflow }}"
      cancel-in-progress: true

    jobs:
        lint-test:
            name: Lint and Test
            runs-on: ubuntu-22.04
            strategy:
              matrix:
                python-version: ["3.12"]

            steps:
                - uses: actions/checkout@v6
                - name: Install Poetry
                  run: pipx install poetry==2.3.4

                - name: Set up Python
                  uses: actions/setup-python@v6
                  with:
                    python-version: ${{ matrix.python-version }}
                    cache: poetry

                - name: Display Python version
                  run: python -c "import sys; print(sys.version)"

                - name: Install dependencies
                  run: poetry install

                - name: Install dependencies
                  run: make install-dev

                - name: Restore mypy cache
                  id: restore-mypy-cache
                  uses: actions/cache/restore@v5
                  with:
                    path: .mypy_cache
                    key: ${{ runner.os }}-py${{ matrix.python-version }}-mypy-${{ hashFiles('poetry.lock', 'pyproject.toml', 'Makefile') }}-${{ github.sha }}
                    restore-keys: |
                      ${{ runner.os }}-py${{ matrix.python-version }}-mypy-${{ hashFiles('poetry.lock', 'pyproject.toml', 'Makefile') }}-

                - name: Lint Python
                  run: make check-python-nofix

                - name: Save mypy cache
                  if: ${{ always() && hashFiles('.mypy_cache/**') != '' }}
                  uses: actions/cache/save@v5
                  with:
                    path: .mypy_cache
                    key: ${{ steps.restore-mypy-cache.outputs.cache-primary-key }}

                - name: Test Python
                  run: make all-tests

                - name: Cleanup residue file
                  run: make clean
