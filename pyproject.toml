[tool.poetry]
name = "soc-classification-utils"
version = "0.1.6"
description = "Utility functions used for SOC classification"
authors = ["Steve Gibbard <steve.gibbard@ons.gov.uk>"]
license = "MIT"
readme = "README.md"

packages = [{ include = "occupational_classification_utils", from = "src"}]

include = [
  { path = "src/occupational_classification_utils/data", format = "sdist" },
  { path = "src/occupational_classification_utils/data", format = "wheel" },
  { path = "src/occupational_classification_utils/data/**/*.xlsx", format = "sdist" },
  { path = "src/occupational_classification_utils/data/**/*.xlsx", format = "wheel" },
  { path = "src/occupational_classification_utils/data/**/*.txt", format = "sdist" },
  { path = "src/occupational_classification_utils/data/**/*.txt", format = "wheel" }
]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.3.0"
langchain-core = ">=1.4.6,<2.0.0"
langchain-google-vertexai = ">=3.2.3,<4.0.0"
langchain-community = ">=0.3.29,<0.4.0"
langchain-chroma = ">=0.2.4,<0.3.0"
autocorrect = "^2.6.1"
numpy = "^2.3.0"
torch = ">=2.13.0,<3.0.0"
sentence-transformers = ">=5.6.0,<6.0.0"
transformers = ">=5.10.1,<6.0.0"
chromadb = "^1.0.12"
openpyxl = "^3.1.5"
langchain-openai = ">=1.1.14,<2.0.0"
langchain-huggingface = ">=1.2.1,<2.0.0"
pydantic = "^2.11.1"
ipykernel = "^6.29.5"
soc-classification-library = {git = "https://github.com/ONSdigital/soc-classification-library.git", tag = "v0.1.6"}
survey-assist-utils = { git = "https://github.com/ONSdigital/survey-assist-utils.git", tag = "v0.0.9" }
jupytext = "^1.17.2"
posthog = ">=2.4.0,<6.0.0"
google-cloud-storage = [
    { version = ">=3.9.0,<4.0.0", python = "<3.13" },
    { version = ">=3.10.0,<4.0.0", python = ">=3.13" },
]

[tool.poetry.group.dev.dependencies]
mkdocs-material = ">=9.7.7,<10.0.0"
pytest-cov = "^6.0.0"
ruff = "^0.15.12"
mypy = "^2.0.0"
bandit = "^1.8.3"
pytest = ">=9.0.3,<10.0.0"
pytest-mock = "^3.15.0"
pre-commit = "^4.2.0"
mkdocs = "^1.6.1"
mkdocstrings = "^0.29.0"
mkdocstrings-python = "^1.16.7"
ipykernel = "^6.29.5"
pytest-asyncio = "^1.2.0"
gcsfs = ">=2026.4.0,<2027.0.0"

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # Enabling ALL is not recommended it will implicitly enable new rules after upgrade.
    # "ALL",

    # Ruff rules: https://docs.astral.sh/ruff/rules/

    "E",      # pycodestyle erros
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "S",      # flake8-bandit
    "D",      # pydocstyle - Enforce existing docstrings only
    "C90",    # mccabe
    "RUF",    # Ruff specific rules

    # PL - Pylint is only partially supported, we also use the pylint tool to catch all the rules.
    # It is enabled here to take advantage of the ruff's speed.
    "PL",
]

ignore = [
    # Conflicts with google docstring style
    "D205",
    # Allow missing docstring, remove to enforce docstrings across the board
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # Disable line length check as it is handled by ruff format
    "E501",
    # indentation contains tabs
    "W191",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # Allow use of assert statements in tests
    "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
